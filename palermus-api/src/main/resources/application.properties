spring.application.name=palermus-api

#Database connection
spring.datasource.url=${URL_DB}palermus
spring.datasource.username=${NAME_DB}
spring.datasource.password=${PASSWORD_DB}
spring.datasource.driver-class-name=org.postgresql.Driver

#Hibernate configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
api.security.token.secret=${JWT_SECRET}

# Secret key para encriptacion determinista de datos sensibles (Debe tener 32 caracteres para AES-256)
app.encryption.secret=PalermusSuperSecretKey2026!@#$%^

# Mostrar SQL y variables
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
